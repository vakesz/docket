# Example override file for `docker compose`. Copy to `compose.override.yml`
# (gitignored) and edit. `docker compose` automatically merges it on top of
# `docker-compose.yml`.
#
# Use this for environment-specific knobs you don't want to bake into the
# main compose file: external Postgres, alternate ports, the bootstrap seed
# values that prime the first LlmProvider + OauthProviderConfig rows.
#
# Once an admin has signed in and configured providers via /admin, the
# bootstrap seed becomes a no-op (gated on the global `setup.complete`
# Setting), so leaving these values here is safe.

services:
  app:
    environment:
      # --- Bootstrap seed (run-once, idempotent) ---
      # OpenAI API key for the agent. The first LlmProvider row also becomes
      # the global default.
      DEV_OPENAI_API_KEY: sk-...

      # GitHub OAuth App for sign-in. Register at:
      #   https://github.com/settings/developers
      # Authorization callback URL (paste this into the GitHub form):
      #   ${PUBLIC_BASE_URL}/api/auth/callback/github
      DEV_GITHUB_CLIENT_ID: Iv1...
      DEV_GITHUB_CLIENT_SECRET: ...

    # Example: bind to a different host port.
    # ports:
    #   - "8080:3000"

  # Example: skip the bundled Postgres and point at an external one.
  # db: !reset null
