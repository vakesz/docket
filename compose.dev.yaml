## Docket — dev override
#
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Differences from prod:
#   - Backend mounts ./src so `uvicorn --reload` picks up edits.
#   - Frontend runs `bun run dev` (Vite HMR) with the repo bind-mounted.
#     node_modules stays inside the container (anonymous volume) so the
#     host's macOS-flavored install doesn't clobber the Linux one.
#   - Both expose their raw ports to the host for direct curling.
#   - /data stays a named volume so wizard output, db, and prompts persist
#     between dev container rebuilds.

services:
  backend:
    command: ["docket", "serve", "--host", "0.0.0.0", "--port", "8765"]
    volumes:
      - ./src:/app/src:ro
      - docket-data:/data
    environment:
      DOCKET_LOG_LEVEL: ${DOCKET_LOG_LEVEL:-debug}
    ports:
      - "8765:8765"

  frontend:
    image: oven/bun:1.3-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      DOCKET_API_URL: http://backend:8765
      DOCKET_API_TOKEN: ${DOCKET_API_TOKEN:?set DOCKET_API_TOKEN in .env}
    ports:
      - "${DOCKET_FRONTEND_PORT:-3000}:3000"
    healthcheck: !reset null
    depends_on:
      backend:
        condition: service_started

volumes:
  frontend-node-modules:
