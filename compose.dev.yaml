## Docket — dev override
#
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Differences from prod:
#   - Backend mounts ./src so `uvicorn --reload` picks up edits.
#   - Frontend reuses the prod Dockerfile's `build` stage (which runs
#     `bun install --frozen-lockfile` with a BuildKit cache mount) and
#     runs `bun run dev` against the image's installed node_modules.
#     Only source files are bind-mounted for Vite HMR.
#   - Both expose their raw ports to the host for direct curling.
#   - /data stays a named volume so wizard output, db, and prompts persist
#     between dev container rebuilds.

services:
  backend:
    command: ["docket", "serve", "--host", "0.0.0.0", "--port", "8765"]
    volumes:
      - ./src:/app/src:ro
      - docket-data:/data
    environment:
      DOCKET_LOG_LEVEL: ${DOCKET_LOG_LEVEL:-debug}
    ports:
      - "8765:8765"

  frontend:
    image: docket-frontend-dev:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: install
    working_dir: /app
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/biome.json:/app/biome.json
      - ./frontend/package.json:/app/package.json
      - ./frontend/bun.lock:/app/bun.lock
    environment:
      DOCKET_API_URL: http://backend:8765
      DOCKET_API_TOKEN: ${DOCKET_API_TOKEN:?set DOCKET_API_TOKEN in .env}
    ports:
      - "${DOCKET_FRONTEND_PORT:-3000}:3000"
    healthcheck: !reset null
    restart: "no"
    depends_on:
      backend:
        condition: service_started
