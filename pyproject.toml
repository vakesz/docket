[project]
name = "docket"
version = "0.1.0"
description = "Terminal work-item triage with LLM chat and safe mutations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "vakesz" }]

dependencies = [
    "azure-devops>=7.1.0b4",
    "openai>=1.50",
    "textual>=0.86",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "keyring>=25",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "rich>=13.7",
    "markdownify>=0.12",
    "markdown-it-py>=3.0",
    "platformdirs>=4.0",
    "structlog>=24.1",
    "mcp>=1.27.0",
]

[project.scripts]
docket = "docket.cli.app:main"

# Third-party provider plugins opt in by declaring their own entries under the
# `docket.providers` group, e.g. in their own pyproject:
#
#     [project.entry-points."docket.providers"]
#     my_provider = "my_pkg.docket_plugin:register"
#
# The referenced callable takes no arguments and registers one or more
# factories via `docket.providers.registry.register(...)`. Docket picks them up
# the first time `build()`, `types()`, or `load_entry_points()` runs. Built-in
# providers register themselves on import of `docket.providers.registry` so
# they don't need an entry here.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-recording>=0.13",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]
# Built SPA bundle — gitignored, populated by `bun run build` (or
# `make frontend-build` / `make wheel`) before `uv build --wheel`.
# `artifacts` overrides VCS exclusions so it ships in the wheel even
# though it's not tracked.
artifacts = ["src/docket/frontend_dist/"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "frontend/",
    "tests/",
    "pyproject.toml",
    "README.md",
    "CLAUDE.md",
    "Makefile",
]
exclude = [
    "frontend/node_modules/",
    "frontend/.vite/",
    "src/docket/frontend_dist/",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
# FastAPI idiom: `Depends(...)` and `Query(...)` belong in argument defaults.
"src/docket/api/**" = ["B008"]
# Typer idiom: `typer.Argument(...)` / `typer.Option(...)` belong in argument defaults.
"src/docket/cli/commands/**" = ["B008"]
"src/docket/cli/app.py" = ["B008"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["docket"]
mypy_path = "src"
