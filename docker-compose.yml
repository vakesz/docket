# Self-host stack for Docket.
#
#   docker compose up         # build + run
#   docker compose down       # stop (data persists in the db-data volume)
#   docker compose down -v    # stop + wipe the database
#
# Bootstrap env: copy `.env.example` to `.env` (gitignored) and fill in.
# AUTH_SECRET / SECRETS_KEY can be auto-generated by `bin/generate-secrets.sh`.
# Per-deployment overrides (e.g. seeding the first OAuth app) belong in
# `compose.override.yml` (also gitignored) — see `compose.override.example.yml`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docket}
      POSTGRES_DB: ${POSTGRES_DB:-docket}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Publish the DB port so `bun run dev` on the host can reach it. Override
    # DB_PORT in .env if your host already has Postgres on 5432.
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docket} -d ${POSTGRES_DB:-docket}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: docket:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Default the in-network DB URL so the operator only has to set the
      # secrets in `.env`. Override here if pointing at an external Postgres.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-docket}:${POSTGRES_PASSWORD:-docket}@db:5432/${POSTGRES_DB:-docket}?schema=public}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
